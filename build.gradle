plugins {
    id 'java'
    id 'io.qameta.allure' version '3.1.0'
    id 'io.freefair.lombok' version '9.2.0'
}

repositories {
    mavenCentral()
}

def selenideVersion = "7.14.0",
    junitVersion = "5.14.4",
    slf4jVersion = "2.0.17"

dependencies {
    testImplementation (
            "io.rest-assured:rest-assured:6.0.0",
            "net.datafaker:datafaker:2.5.4",
            "org.assertj:assertj-core:3.27.7",
            "io.rest-assured:json-schema-validator:6.0.0",
            "io.qameta.allure:allure-rest-assured:2.35.2",
            "com.codeborne:selenide:$selenideVersion",
            "io.qameta.allure:allure-selenide:2.35.2",
            "org.junit.jupiter:junit-jupiter:$junitVersion",
            "org.slf4j:slf4j-simple:$slf4jVersion"
    )
}

tasks.withType(Test) {
    useJUnitPlatform()
    systemProperties(System.getProperties())

    testLogging {
        lifecycle {
            events "started", "skipped", "failed", "standard_error", "standard_out"
            exceptionFormat "short"
        }
    }
}